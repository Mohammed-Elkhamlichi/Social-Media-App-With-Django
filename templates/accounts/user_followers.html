{% extends "core/home.html" %}
{% load is_user_online %}
{% block home %}
<h1 class="text-2xl text-gray-400 my-2">@followers</h1>
<div class="flex flex-row flex-wrap my-5 justify-center itmes-center">
    {% for follower in followers %}
    <div class="transition duration-200 ease-in-out flex flex-col bg-slate-700 shadow-md shadow-slate-800 mx-2 my-5 px-2 rounded justify-center items-center hover:translate-y-3 hover:shadow-md">
        <div class="">
            <div class="h-5 w-5 {% is_user_online follower.username %} -mb-1"></div>
            <img src="{{follower.profile_pic.url}}" alt="" class="h-20 w-20 rounded-full mr-1" />
        </div>
        <div class="text-gray-400  my-1 px-2 py-1 font-bold">
            <a href="{% url 'accounts:profile' follower.username %}"  class="text-sm">
                @{{follower.username|title}}</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock home %}
