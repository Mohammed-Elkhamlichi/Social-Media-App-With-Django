{% extends "core/home.html" %} {% block home %}
<div class="flex justify-center items-center w-full">
    <form action="" method="POST"
        class="flex flex-col justify-center items-center w-11/12 m-auto rounded bg-slate-700 shadow-sm shadow-slate-900 border-2 border-slate-700 p-2 my-20"
        enctype="multipart/form-data">
        {% csrf_token %}
        <div class="w-full flex flex-col justify-center items-center">
            <img src="{{ request.user.profile_pic.url }}" alt="" class="rounded-full w-32 h-32" />
            <label for="profile_pic"
                class="cursor-pointer border transition duration-200 ease-in-out rounded border-gray-300 text-gray-300 shadow-lg text-center px-4 py-1 my-2 hover:shadow-slate-600 hover:border-gray-500 hover:text-green-500">
                Select image
                <input type="file" name="profile_pic" id="profile_pic" class="text-gray-300 hidden" />
            </label>
        </div>
        <div class="flex flex-col w-full">
            <div class="flex flex-col">
                <label for="first_name" class="my-2 text-gray-300">First Name</label>
                <input type="text" name="first_name" id="first_name" placeholder="Mohammed"
                    value="{{request.user.first_name}}"
                    class="rounded transition duration-200 ease-in-out shadow-md hover:outline-sky-500 hover:shadow-gray-800 hover:text-green-500" />
            </div>
            <div class="flex flex-col">
                <label for="last_name" class="my-2 text-gray-300">Last Name</label>
                <input type="text" name="last_name" id="last_name" placeholder="Elkhamlichi"
                    value="{{request.user.last_name}}"
                    class="rounded transition duration-200 ease-in-out shadow-md hover:outline-sky-500 hover:shadow-gray-800 hover:text-green-500" />
            </div>
        </div>
        <div class="w-full flex flex-col">
            <label for="email" class="my-2 text-gray-300">Email</label>
            <input type="email" name="email" id="email" placeholder="mohammed@gmail.com" value="{{request.user.email}}"
                class="rounded transition duration-200 ease-in-out shadow-md hover:outline-sky-500 hover:shadow-gray-800 hover:text-green-500" />
        </div>
        <div class="w-full flex flex-col">
            <label for="phone" class="my-2 text-gray-300">Phone Number</label>
            <input type="tel" name="phone" id="phone" placeholder="+212712345678" {%if request.user.phone is not None%}
                value="{{request.user.phone}}" {% endif %}
                class="rounded transition duration-200 ease-in-out shadow-md hover:outline-sky-500 hover:shadow-gray-800 hover:text-green-500" />
        </div>
        <div class="w-full flex flex-col">
            <label for="bio" class="my-2 text-gray-300">Bio</label>
            <textarea type="text" name="bio" id="bio" placeholder="full stack web developer python/django"
                class="h-52 text-start rounded transition duration-200 ease-in-out shadow-md hover:outline-sky-500 hover:shadow-gray-800 hover:text-green-500">
            {% if request.user.bio is not None %}
                {{request.user.bio}}
            {% endif %}
                
                </textarea>
        </div>
        <div class="w-full flex flex-col">
            <label for="country" class="my-2 text-gray-300">Country</label>
            <input type="text" name="country" id="country" placeholder="Morocco" {%if request.user.country is not None%}
                value="{{request.user.country}}" {% endif %}
                class="rounded transition duration-200 ease-in-out shadow-md hover:outline-sky-500 hover:shadow-gray-800 hover:text-green-500" />
        </div>
        <div class="mt-5">
            <input type="submit" value="Update Profile"
                class="py-2 px-5 shadow-md shadow-slate-800 text-gray-300 transition duration-200 ease-in-out hover:text-white rounded hover:bg-green-700 my-5 cursor-pointer" />
        </div>
    </form>
</div>
{% endblock home %}
