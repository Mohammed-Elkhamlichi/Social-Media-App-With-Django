{% extends "base.html" %} {% block base %}
<div class="my-20 w-2/3 mx-auto">
    <form action="" method="post"
        class="bg-slate-800 p-3 shadow-sm rounded-lg shadow-slate-600 m-auto my-10 w-3/5 md:w-96">
        {% if form.errors %}
        <div class="w-full bg-red-600 px-2 py-4 rounded text-white">
            {% for field in form %}
            {% for error in field.errors %}
            {{error}}
            {% endfor %}
            {% endfor %}
        </div>
        {% endif %}
        {#% include "messages.html" %#} {% csrf_token %}
        <div class="mb-6">
            <label for="username"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">Username</label>
            <input type="text" id="username" name="username"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                placeholder="John-Doe.dev" required />
        </div>
        <div class="mb-6">
            <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">Email
                address</label>
            <input type="email" id="email" name="email"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                placeholder="john.doe@company.com" required />
        </div>
        <div class="mb-6">
            <label for="password1"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">Password</label>
            <input type="password" id="password1" name="password1"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                placeholder="•••••••••" required />
        </div>
        <div class="mb-6">
            <label for="password2" class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">Confirm
                password</label>
            <input type="password" id="password2" name="password2"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                placeholder="•••••••••" required />
        </div>
        <div class="flex items-start mb-6">
            <label for="remember" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-400">I don't have an
                account
                <a href="{% url 'accounts:login_user' %}" class="text-blue-600 hover:underline dark:text-blue-500">Sign
                    In</a>.</label>
        </div>
        <button type="submit"
            class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
            Sign Up
        </button>
    </form>
</div>

{% endblock base %}
