{% load tailwind_tags %}

{% tailwind_css %}

{% if messages %}
<ul class="messages  transition-opacity delay-700 duration-1000ease-in-out ">
    {% for message in messages %}

    {% if message.tags == "error" %}
    <div class="p-4 mb-4 text-sm text-white bg-red-500 rounded-lg rounded-b-none " role="alert">
        <span class="font-medium">{{ message.tags }}!</span> {{ message }}
    </div>
    {% else %}
    <div class="p-4 mb-4 text-sm text-white bg-green-500 rounded-lg rounded-b-none " role="alert">
        <span class="font-medium">{{message.tags}}!</span> {{ message }}
    </div>
    {% endif %}
    {% endfor %}
</ul>
{% endif %}
