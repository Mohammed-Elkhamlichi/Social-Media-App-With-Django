<div class="transition delay-100 duration-1000 ease-linear group bg-green-500 text-black dark:text-gray-400 p-2 w-11/12 rounded m-auto scale-100 flex flex-row justify-between items-center"
    id="alerts_container">
    <h1 class="text-1xl font-mono text-center">
        {{message}}
    </h1>
    <span
        class="transition delay-1000 duration-1000 ease-in-out text-2xl flex justify-center items-center bg-slate-700 border-2 border-yellow-600 w-10 h-10 cursor-pointer rounded-full p-1 text-yellow-600"
        id="close_alert">
        x
    </span>
</div>
