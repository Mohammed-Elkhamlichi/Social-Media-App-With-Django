<div class="flex flex-col items-center justify-center text-center">
    <h1 class="text-2xl  text-gray-400 text-xl">
        @Interesting Topics
    </h1>
</div>
{% for topic in topics %}
<div
    class="transition ease-in-out  duration-300 flex flex-row justify-between items-center my-3 w-full p-2 m-auto bg-slate-700 shadow-sm shadow-gray-800 hover:shadow-gray-900 rounded hover:translate-x-2">
    <a href="{% url 'core:topic_rooms' topic.id %}"
        class="text-gray-400 font-bold text-sm text-center ">{{topic.name|title}}</a>
    <form name="topic_join_form" action="" method="post"
        class="transition ease-in-out duration-100 text-gray-300 bg-cyan-300  font-bold px-3 py-2 text-sm rounded dark:text-slate-800 cursor-pointer">
        {% csrf_token %}
        <input type="hidden" name="joined_topic" value="{{topic.name}}" />
        {% if request.user in topic.subscribers.all %}
        <input type="submit" value="Quit" id="{{topic.id}}" class="opacity-50 group-hover:opacity-100 cursor-pointer" />
        {% else %}
        <input type="submit" value="Join" id="{{topic.id}}" class="opacity-100 cursor-pointer" />

        {% endif %}
    </form>

</div>
{% endfor %}
<script>
    // handle quit join topic form
    const quitJoinBtn = document.getElementsByName('topic_join_form')
    quitJoinBtn.forEach(async function (item) {
        item.addEventListener('submit', async function (e) {
            e.preventDefault()
            let input = item.childNodes[5]
            const topicID = parseInt(input.id)
            console.log({ input: input.value, topicID })
            if (input.value === 'Quit') {
                input.value = 'Join'
                input.setAttribute('class', 'opacity-100 cursor-pointer')
                quitJoinTopic(topicID, "quit")
            } else if (input.value === 'Join') {
                input.value = 'Quit'
                input.setAttribute('class', 'opacity-50 group-hover:opacity-100 cursor-pointer')
                quitJoinTopic(topicID, "join")
            }
        });
    })
    function quitJoinTopic(topicID, state) {
        // http://127.0.0.1:8000/join-quit-topic/100/join/
        let ApiUri = `http://127.0.0.1:8000/join-quit-topic/${topicID}/${state}/`
        console.log({ ApiUri })
        fetch(ApiUri)
            .then(response => response.json())
            .then(data => console.log({ data }))
            .catch(err => console.error({ err }));
    }
</script>
