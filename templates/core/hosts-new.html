
<h1 class="text-2xl text-center text-gray-400">
    @Top Hosts {{hosts.count}}
</h1>
{% for host in hosts %} {% if host != request.user %}
<div
    class="transition ease-in-out  duration-300 flex flex-row justify-between items-center my-3 w-full p-2 m-auto bg-slate-700 shadow-sm shadow-gray-800 hover:shadow-gray-900 rounded hover:-translate-x-2"
>
    <a
        href="{% url 'accounts:profile' host.username %}"
        class="text-gray-400 font-bold text-sm text-center"
        >@{{host.username|title}}</a
    >
    {% if request.user in host.followers.all %}

    <a
    href="{% url 'accounts:follow_unfollow_user' host.username 'unfollow' %}"
    class="mx-2 text-green-500 border-2 rounded-full py-1 px-4 transition duration-200 ease-in-out hover:border-green-500 hover:text-white cursor-pointer"
    >
        unfollow
    </a>
    {% else %}
    <a
    href="{% url 'accounts:follow_unfollow_user' host.username 'follow'  %}"
        class="mx-2 text-green-500 border-2 rounded-full py-1 px-4 transition duration-200 ease-in-out hover:border-green-500 hover:text-white cursor-pointer"
    >
        follow
    </a>
    {% endif %}
</div>
{% endif %} {% endfor %}
