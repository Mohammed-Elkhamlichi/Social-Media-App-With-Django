
<h1 class="text-2xl text-center text-gray-400">
    @Top Hosts {{hosts.count}}
</h1>
{% for host in hosts %} {% if host != request.user %}
<div
    class="transition ease-in-out  duration-300 flex flex-row justify-between items-center my-3 w-full p-2 m-auto bg-slate-700 shadow-sm shadow-gray-800 hover:shadow-gray-900 rounded hover:-translate-x-2"
>
    <a
        href="{% url 'accounts:profile' host.username %}"
        class="text-gray-400 font-bold text-sm text-center"
        >@{{host.username|title}}</a
    >
    <form
        action="{% url 'accounts:set_followers' host.username %}"
        method="get"
        class="group transition ease-in-out dely-100 duration-500 text-gray-300 bg-cyan-300 text-sm font-bold px-3 py-2 rounded dark:text-slate-800 cursor-pointer"
    >
        {% if host in request.user.following.all %}
        <input
            type="hidden"
            name="un_follow_user"
            value="un_follow_user"
        />
        <input type="submit" value="following" class="opacity-50 group-hover:opacity-100 cursor-pointer" />
        {% else %}
        <input type="hidden" name="follow_user" value="follow_user" />
        <input type="submit" value="follow" class=" opacity-100  cursor-pointer"/>
        {% endif %}
    </form>
</div>
{% endif %} {% endfor %}
