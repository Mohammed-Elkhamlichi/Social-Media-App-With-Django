{% load is_user_online %}
<h1 class="text-2xl text-center text-gray-400">@Top Hosts {{hosts.count}}</h1>
{% for host in hosts %} {% if host != request.user %}
<div
    class="transition ease-in-out duration-300 flex flex-row justify-between items-center my-3 w-full p-1 m-auto bg-slate-700 shadow-sm shadow-gray-800 hover:shadow-gray-900 rounded hover:-translate-x-2"
    name="follow_unfollow_container"
>
    <div class="flex flex-row items-center">
        <div class="relative rounded-full">
            <div class="{% is_user_online host.username %} h-3 w-3"></div>
            <img src="{{host.profile_pic.url}}" alt="" class="w-10 h-10 rounded-full border-2 border-slate-700" />
        </div>
        <a href="{% url 'accounts:profile' host.username %}" class="text-gray-400 font-bold text-sm text-center">
            @{{host.username|title}}
        </a>
    </div>
    <div>
        {% if request.user in host.followers.all %}

        <button
            class="mx-2 text-green-500 text-sm border-2 rounded-full py-1 px-2 transition duration-200 ease-in-out hover:border-green-500 hover:text-white cursor-pointer"
            id="{{host.username}}"
        >
            unfollow
        </button>
        {% else %}
        <button
            class="mx-2 text-green-500 border-2 text-sm rounded-full py-1 px-3 transition duration-200 ease-in-out hover:border-green-500 hover:text-white cursor-pointer"
            id="{{host.username}}"
        >
            follow
        </button>
        {% endif %}
    </div>
</div>
{% endif %} {% endfor %}
