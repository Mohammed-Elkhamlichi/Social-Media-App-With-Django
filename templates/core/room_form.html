{% extends "base.html" %}

{% block base %}

<h1 class="text-center mx-auto my-5 text-4xl border-b-2 w-72 border-white ">Room Form Page</h1>
<form action="" method='post' class="bg-green items-center bg-slate-400">
    {% csrf_token %}
    {{form.as_p}}
    {% if is_update %}
    <input type="submit" value="Update Room" class="py-2 px-5 border rounded bg-green-500">
    {% else %}
    <input type="submit" value="Update Room">

    {% endif %}
</form>

{% endblock base %}
